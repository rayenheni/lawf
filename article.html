<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Article — CMCB Avocat et Conseils</title><link rel="stylesheet" href="/assets/css/style.css?v=cmcb3"></head><body class="article-page"><header class="header scrolled"><a class="brand" href="/"><span class="monogram">CM<br><i>CB</i></span><span><b>CMCB</b><small>avocat et conseils</small></span></a><nav><a href="/">Accueil</a><a href="/blog.html">Publications</a><a href="/#contact">Contact</a></nav></header><main><article class="article" id="article"><p>Chargement…</p></article></main><script src="/assets/js/supabase-config.js"></script><script>!async function(){const el=document.querySelector('#article'),slug=new URLSearchParams(location.search).get('slug');try{const [p]=await cmcbApi(`posts?slug=eq.${encodeURIComponent(slug)}&published=eq.true&select=*`);if(!p)throw 0;document.title=`${p.seo_title||p.title} — CMCB`;document.querySelector('meta[name=description]')?.remove();document.head.insertAdjacentHTML('beforeend',`<meta name="description" content="${(p.seo_description||p.excerpt).replaceAll('"','&quot;')}">`);el.innerHTML=`<a href="/blog.html" class="back">← Toutes les publications</a><small>${p.category} · ${new Date(p.published_at).toLocaleDateString('fr-TN')}</small><h1>${p.title}</h1><p class="article-lead">${p.excerpt}</p>${p.image_url?`<img src="${p.image_url}" alt="">`:''}<div class="article-content">${p.content.split('\n').map(x=>x?`<p>${x}</p>`:'').join('')}</div><div class="article-cta"><h2>Une question sur votre situation ?</h2><a class="button" href="/#contact">Consulter le cabinet →</a></div>`}catch(e){el.innerHTML='<h1>Article introuvable</h1><a href="/blog.html">Retour aux publications</a>'}}();</script></body></html>
