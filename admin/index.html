<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration — CMCB</title><link rel="stylesheet" href="/assets/css/admin.css"></head><body><main id="admin"><section class="login" id="login"><div class="admin-brand">CMCB <span>Administration</span></div><h1>Bienvenue, Maître.</h1><p>Connectez-vous pour gérer les demandes et publications.</p><form id="login-form"><label>E-mail<input type="email" name="email" required></label><label>Mot de passe<input type="password" name="password" required></label><button>Se connecter</button><p class="status"></p></form></section><section class="dashboard" id="dashboard" hidden><aside><div class="admin-brand">CMCB <span>Cabinet</span></div><nav><button data-view="appointments" class="active">Rendez-vous</button><button data-view="posts">Publications</button><a href="/" target="_blank">Voir le site ↗</a></nav><button id="logout">Déconnexion</button></aside><div class="workspace"><header><div><small>ESPACE CABINET</small><h1 id="view-title">Demandes de rendez-vous</h1></div><button id="new-post" hidden>+ Nouvel article</button></header><div id="appointments-view"><div class="stats" id="stats"></div><div class="table-wrap"><table><thead><tr><th>Client</th><th>Domaine</th><th>Contact</th><th>Date</th><th>Statut</th></tr></thead><tbody id="appointments"></tbody></table></div></div><div id="posts-view" hidden><div class="posts-admin" id="posts-admin"></div></div></div></section><dialog id="post-dialog"><form id="post-form"><header><h2>Rédiger une publication</h2><button type="button" class="close">×</button></header><input type="hidden" name="id"><div class="two"><label>Titre<input name="title" required></label><label>Catégorie<input name="category" value="Actualité juridique"></label></div><label>Résumé SEO<textarea name="excerpt" rows="2" maxlength="300" required></textarea></label><label>Contenu de l’article<textarea name="content" rows="10" required></textarea></label><div class="two"><label>URL de l’image<input name="image_url" type="url"></label><label>Slug URL<input name="slug" required placeholder="titre-de-l-article"></label></div><label class="check"><input type="checkbox" name="published"> Publier immédiatement</label><button class="primary">Enregistrer l’article</button><p class="status"></p></form></dialog></main><script src="/assets/js/supabase-config.js"></script><script src="/assets/js/admin.js"></script></body></html>
