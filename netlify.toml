# Site 100 % statique : aucun build, on publie la racine du dépôt.
[build]
  command = ""
  publish = "."

# Netlify sert automatiquement /en/ et /ar/ (pretty URLs) —
# ces redirections couvrent les variantes sans slash final.
[[redirects]]
  from = "/en"
  to = "/en/index.html"
  status = 200

[[redirects]]
  from = "/ar"
  to = "/ar/index.html"
  status = 200

# 404 personnalisée = la page d'accueil (évite les écrans vides)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404

# Images : cache long (leur contenu ne change jamais)
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# CSS/JS : revalidation systématique — un nouveau déploiement
# doit toujours servir la nouvelle version (pas de cache immutable
# sur des URLs non fingerprintées, sinon les navigateurs gardent
# l'ancien style.css).
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
